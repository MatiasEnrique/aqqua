[package]
name = "acp-hub"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-client-protocol = "2.1.0"
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
futures = "0.3.34"
rmcp = { version = "3.2.0", features = [
  "server",
  "transport-io",
  "transport-child-process",
  "transport-async-rw",
  "client",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
